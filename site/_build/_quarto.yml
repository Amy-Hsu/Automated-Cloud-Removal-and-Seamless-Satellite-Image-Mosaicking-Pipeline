project:
  type: website
  output-dir: _site

metadata-files:
  - api/_sidebar.yml

website:
  title: "Cloud removal and seamless mosaicking"
  site-url: https://buckai-observatory.org/Automated-Cloud-Removal-and-Seamless-Satellite-Image-Mosaicking-Pipeline/
  repo-url: https://github.com/buckai-observatory/Automated-Cloud-Removal-and-Seamless-Satellite-Image-Mosaicking-Pipeline
  repo-actions: [issue]
  navbar:
    left:
      - href: index.md
        text: "Home"
      - href: TROUBLESHOOTING.md
        text: "Troubleshooting"
      - text: "Pipeline"
        menu:
          - href: step1_color_balance.md
            text: "Step 1: color balance"
          - href: step2_mosaic.md
            text: "Step 2: seamline mosaic"
          - href: step3_pan_mosaic.md
            text: "Step 3: Pan mosaic"
          - href: step4_cloud_removal.md
            text: "Step 4: cloud filling"
          - href: sentinel2_demo.md
            text: "Sentinel-2 demo"
      - href: api/index.qmd
        text: "API reference"
      - text: "Project"
        menu:
          - href: CONTRIBUTING.md
            text: "Contributing"
    right:
      - icon: github
        href: https://github.com/buckai-observatory/Automated-Cloud-Removal-and-Seamless-Satellite-Image-Mosaicking-Pipeline
        aria-label: GitHub
  page-footer:
    center: "Generated from the Markdown files, notebooks and docstrings of the [repository](https://github.com/buckai-observatory/Automated-Cloud-Removal-and-Seamless-Satellite-Image-Mosaicking-Pipeline); edit those, not this site."

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true

quartodoc:
  package: null                  # objects below are given by their full paths
  dir: api
  title: "API reference"
  sidebar: api/_sidebar.yml
  sections:
    - title: "Step 2: seamline mosaic"
      desc: "`step2_mosaic/step2mosaic.py`"
      contents:
        - step2mosaic.main
        - step2mosaic.polygonize_valid_area
        - step2mosaic.test_overlap
        - step2mosaic.find_raster_intersect
        - step2mosaic.find_raster_intersect_for_mosaic
        - step2mosaic.clipImg
        - step2mosaic.MakeTrueID
        - step2mosaic.buildGraph
        - step2mosaic.border_connection
        - step2mosaic.bfs
        - step2mosaic.spiral
        - step2mosaic.add_at_pos
        - step2mosaic.blendMask
        - step2mosaic.blend_preprocess
        - step2mosaic.blend_preprocess_for_order
        - step2mosaic.blend_preprocess_for_mosaic
        - step2mosaic.blend_preprocess_order_for_mosaic
        - step2mosaic.mask_blend_preprocess_for_order
        - step2mosaic.mask_blend_preprocess_for_order_loop
    - title: "Step 3: Pan mosaic"
      desc: "`step3_pan_mosaic/mosaicPan_block_rs.py`"
      contents:
        - mosaicPan_block_rs.main
        - mosaicPan_block_rs.pan_scene_path
    - title: "Step 4: cloud filling"
      desc: "`step4_cloud_removal/step4cloud_removal.py`"
      contents:
        - step4cloud_removal.main
        - step4cloud_removal.patch_margins
        - step4cloud_removal.seamless_clone_over_nodata
        - step4cloud_removal.border_elems_generic
        - step4cloud_removal.pan_scene_path
